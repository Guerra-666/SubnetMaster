<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen p-6">
    <!-- Modal -->
    <div id="modal" class="hidden modal-container">
        <div class="bg-white rounded-2xl border border-gray-200 w-full max-w-xl mx-4 shadow-2xl">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-900">Detalles Técnicos</h2>
                </div>
                <button onclick="toggleModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="pasosCalculo" class="p-5 space-y-4 text-sm text-gray-600"></div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 bg-white/80 backdrop-blur-sm px-6 py-2 rounded-full shadow-sm border border-gray-200">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span class="text-sm font-medium text-gray-700">Network Calculator Pro</span>
            </div>
            <h1 class="text-4xl font-bold text-gray-900 mt-4">Subnet Master</h1>
            <p class="text-gray-500">División profesional de redes IP</p>
        </div>

        <!-- Calculator Card -->
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl border border-gray-200 p-6 shadow-lg">
            <div class="space-y-6">
                <!-- Controls Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700 flex items-center gap-1">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                </svg>
                                Número de Subredes
                            </label>
                            <input type="number" id="subnets" 
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-sm"
                                min="1" max="128" value="4" onchange="generarCamposNombres()">
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-gray-700 flex items-center gap-1">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                                </svg>
                                Nombres de Áreas
                            </label>
                            <div id="nombreSubredes" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button onclick="calcularSubredes()" 
                        class="flex-1 bg-gradient-to-br from-blue-600 to-blue-500 text-white px-6 py-3.5 rounded-xl text-sm font-medium hover:shadow-lg transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Generar Subredes
                    </button>
                    <button onclick="mostrarExplicacion()" 
                        class="px-6 py-3.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50/80 transition-all border border-gray-200 flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Explicación
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl border border-gray-200 overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50/80 border-b border-gray-200">
                        <tr>
                            <th data-tooltip="Nombre descriptivo del área" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Área
                            </th>
                            <th data-tooltip="Dirección base de la subred" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Subred
                            </th>
                            <th data-tooltip="Primera dirección asignable" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                IP Inicial
                            </th>
                            <th data-tooltip="Última dirección asignable" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                IP Final
                            </th>
                            <th data-tooltip="Dirección de broadcast" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Broadcast
                            </th>
                            <th data-tooltip="Máscara de red CIDR" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Máscara
                            </th>
                            <th data-tooltip="Tamaño del bloque de IPs" 
                                class="tooltip px-5 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Salto
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tabla-resultados" class="divide-y divide-gray-200/50"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
